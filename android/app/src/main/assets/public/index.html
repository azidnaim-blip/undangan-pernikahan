<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BrewPoint POS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #181615;
      color: #F8F6F2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    .logo {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #C2552D, #9E3E1B);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(194, 85, 45, 0.4);
      margin-bottom: 20px;
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #A89F97;
      margin: 0 0 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #C2552D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-box {
      display: none;
      margin-top: 10px;
      text-align: center;
    }
    .retry-btn {
      margin-top: 12px;
      background: #C2552D;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24">
      <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
      <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
      <line x1="6" y1="1" x2="6" y2="4"></line>
      <line x1="10" y1="1" x2="10" y2="4"></line>
      <line x1="14" y1="1" x2="14" y2="4"></line>
    </svg>
  </div>
  <h1>BrewPoint POS</h1>
  <p>Menghubungkan ke sistem kasir...</p>
  <div class="spinner" id="spinner"></div>

  <div class="offline-box" id="offline-box">
    <p style="color:#FF9500; margin-bottom:8px;">⚠️ Periksa koneksi internet perangkat.</p>
    <button class="retry-btn" onclick="location.reload()">Coba Lagi</button>
  </div>

  <script>
    setTimeout(function() {
      var spinner = document.getElementById('spinner');
      var offlineBox = document.getElementById('offline-box');
      if (spinner && offlineBox) {
        spinner.style.display = 'none';
        offlineBox.style.display = 'block';
      }
    }, 12000);
  </script>
</body>
</html>
