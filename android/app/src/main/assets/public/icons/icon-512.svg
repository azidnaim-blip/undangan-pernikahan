<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2552D"/>
      <stop offset="50%" stop-color="#B54B24"/>
      <stop offset="100%" stop-color="#7C2A0E"/>
    </linearGradient>
    <linearGradient id="steamGradient512" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient512)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Coffee Cup Graphics with Filter -->
  <g transform="translate(96, 112)" filter="url(#dropShadow)">
    <!-- Steam Curves -->
    <path d="M104,60 C98,34 110,12 104,0" fill="none" stroke="url(#steamGradient512)" stroke-width="10" stroke-linecap="round"/>
    <path d="M160,54 C154,28 166,6 160,0" fill="none" stroke="url(#steamGradient512)" stroke-width="10" stroke-linecap="round"/>
    <path d="M216,60 C210,34 222,12 216,0" fill="none" stroke="url(#steamGradient512)" stroke-width="10" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M40,90 L280,90 C280,200 224,248 160,248 C96,248 40,200 40,90 Z" fill="#FFFFFF"/>
    
    <!-- Inner Coffee Surface -->
    <ellipse cx="160" cy="94" rx="112" ry="20" fill="#4A1E0D"/>
    <!-- Latte Art Heart -->
    <path d="M160,90 C146,80 134,90 160,106 C186,90 174,80 160,90 Z" fill="#FDF3EE"/>

    <!-- Cup Handle -->
    <path d="M272,112 C328,112 328,196 272,196" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

    <!-- Saucer / Plate -->
    <path d="M0,264 C0,264 48,288 160,288 C272,288 320,264 320,264" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
